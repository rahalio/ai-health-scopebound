openapi: 3.0.3
info:
  title: Scopebound
  version: 0.1.0
  description: >-
    Care-team roster and delegation ledger for mixed human-machine care teams.
    Software agents are credentialed as teammates with an organisation-authored
    scope of practice; every clinical task carries an accountable performer, a
    named supervising clinician, a patient consent to machine involvement, and a
    clocked escalation path. Overrides, subgroup performance and safety events are
    first-class so that machine-performed care remains traceable to a licence.
  x-product-slug: ai-health-scopebound
  x-source: ai-in-health/Accenture-Health-Meet-Todays-Healthcare-Team-Patients-Doctors-Machines/
servers:
  - url: https://api.example.com
tags:
  - name: Teammates
    description: Human clinicians and machine agents on the care-team roster, with credentialing
  - name: Scopes
    description: Versioned scopes of practice, task classes, and scope suspension
  - name: Tasks
    description: Plan-of-care tasks, delegation grants, and revocation
  - name: Consent
    description: Patient machine-involvement preferences and withdrawal
  - name: Escalations
    description: Clocked deterioration escalation with tiered acknowledgement
  - name: Handoffs
    description: Structured accountability transfer between teammates
  - name: Surveillance
    description: Override telemetry, subgroup performance, and panel capacity
  - name: Safety
    description: Near-miss and harm events involving machine teammates
  - name: Audit
    description: Per-task accountability reconstruction and access trails
paths:
  /v1/teammates:
    get:
      operationId: listTeammates
      summary: List human and machine teammates on the roster
      tags: [Teammates]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: kind
          in: query
          schema:
            type: string
            enum: [human_clinician, machine_agent]
        - name: rosterStatus
          in: query
          schema:
            type: string
            enum: [candidate, shadow, live, suspended, retired]
      responses:
        "200":
          description: Teammates page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeTeammate"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: registerTeammate
      summary: Register a clinician or a candidate machine agent
      tags: [Teammates]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeammateCreate"
      responses:
        "201":
          description: Teammate registered as candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTeammate"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/teammates/{teammateId}:
    parameters:
      - $ref: "#/components/parameters/TeammateId"
    get:
      operationId: getTeammate
      summary: Get a teammate with current scopes and supervision relationships
      tags: [Teammates]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Teammate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTeammate"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/teammates/{teammateId}/credentialing:
    parameters:
      - $ref: "#/components/parameters/TeammateId"
    post:
      operationId: submitCredentialingReview
      summary: Submit a credentialing decision including in-population shadow results
      description: >-
        An agent may not receive live delegation until a credentialing review records
        intended use, validation evidence, known failure modes, subgroup performance
        and a completed shadow-mode period against this organisation's population.
      tags: [Teammates]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialingDecision"
      responses:
        "201":
          description: Credentialing decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeValidationDossier"
        "409":
          description: Shadow-mode period incomplete or dossier missing subgroup evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/task-classes:
    get:
      operationId: listTaskClasses
      summary: List delegatable clinical task classes and their supervision requirements
      tags: [Scopes]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: jurisdiction
          in: query
          schema:
            type: string
            example: US-OH
      responses:
        "200":
          description: Task classes page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeTaskClass"
  /v1/scopes:
    get:
      operationId: listScopesOfPractice
      summary: List published scopes of practice
      tags: [Scopes]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: teammateId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, suspended, revoked]
      responses:
        "200":
          description: Scopes page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeScopeOfPractice"
    post:
      operationId: publishScopeOfPractice
      summary: Publish a new version of a teammate's scope of practice
      tags: [Scopes]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeOfPracticeCreate"
      responses:
        "201":
          description: Scope published and pinned by content hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeScopeOfPractice"
        "409":
          description: Teammate not credentialed for one or more requested task classes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/scopes/{scopeId}/suspension:
    parameters:
      - $ref: "#/components/parameters/ScopeId"
    post:
      operationId: suspendScopeOfPractice
      summary: Suspend a scope and reassign its in-flight tasks to human performers
      tags: [Scopes]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeSuspensionCreate"
      responses:
        "202":
          description: Suspension accepted and affected tasks queued for reassignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeScopeSuspension"
  /v1/patients/{patientId}/care-team:
    parameters:
      - $ref: "#/components/parameters/PatientId"
    get:
      operationId: getCareTeam
      summary: Get the patient's care team including machine teammates and supervisors
      tags: [Teammates]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Care team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCareTeam"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/care-tasks:
    get:
      operationId: listCareTasks
      summary: List plan-of-care tasks by performer, supervisor, or patient
      tags: [Tasks]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: patientId
          in: query
          schema:
            type: string
        - name: performerId
          in: query
          schema:
            type: string
        - name: supervisorId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [unassigned, delegated, in_progress, escalated, completed, reassigned, lapsed]
      responses:
        "200":
          description: Care tasks page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeCareTask"
    post:
      operationId: createCareTask
      summary: Create a plan-of-care task requiring an accountable performer
      tags: [Tasks]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareTaskCreate"
      responses:
        "201":
          description: Task created, awaiting delegation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCareTask"
  /v1/care-tasks/{taskId}/delegation:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: grantTaskDelegation
      summary: Grant an expiring delegation naming performer, supervisor and consent basis
      description: >-
        Rejected when the task class falls outside the performer's published scope,
        when no supervising clinician holds an adequate licence, or when the patient
        has declined machine involvement for this task class.
      tags: [Tasks]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegationGrantCreate"
      responses:
        "201":
          description: Delegation granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDelegationGrant"
        "409":
          description: Task class outside scope, supervision inadequate, or consent declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: revokeTaskDelegation
      summary: Revoke a delegation immediately and return the task to a human performer
      tags: [Tasks]
      security:
        - BearerAuth: []
      parameters:
        - name: reasonCode
          in: query
          required: true
          schema:
            type: string
            enum:
              [clinical_change, patient_request, scope_suspended, supervisor_change, agent_defect]
      responses:
        "200":
          description: Delegation revoked and task reassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCareTask"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/patients/{patientId}/consent:
    parameters:
      - $ref: "#/components/parameters/PatientId"
    get:
      operationId: getMachineInvolvementConsent
      summary: Get machine-involvement consent by task class and data recipient
      tags: [Consent]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Consent record in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeConsentRecord"
    put:
      operationId: setMachineInvolvementConsent
      summary: Record or amend machine-involvement consent and recipient permissions
      tags: [Consent]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRecordUpsert"
      responses:
        "200":
          description: Consent recorded with comprehension attestation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeConsentRecord"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/patients/{patientId}/consent/withdrawal:
    parameters:
      - $ref: "#/components/parameters/PatientId"
    post:
      operationId: withdrawMachineInvolvement
      summary: Withdraw machine involvement mid-episode and schedule human takeover
      tags: [Consent]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskClassCodes]
              properties:
                taskClassCodes:
                  type: array
                  items:
                    type: string
                humanTakeoverBy:
                  type: string
                  format: date-time
                  description: Deadline by which a human performer must hold the task
                statedReason:
                  type: string
      responses:
        "202":
          description: Withdrawal accepted, affected tasks routed to human fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeConsentRecord"
  /v1/escalations:
    get:
      operationId: listEscalations
      summary: List escalations by tier, acknowledgement state, or recipient
      tags: [Escalations]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          schema:
            type: string
            enum: [raised, acknowledged, promoted, resolved]
        - name: recipientId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Escalations page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeEscalationEvent"
    post:
      operationId: raiseEscalation
      summary: Raise a deterioration escalation with triggering evidence
      tags: [Escalations]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationCreate"
      responses:
        "201":
          description: Escalation raised with acknowledgement deadline and tier ladder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEscalationEvent"
        "403":
          description: Raising teammate lacks scope for this task class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/escalations/{escalationId}/acknowledgement:
    parameters:
      - $ref: "#/components/parameters/EscalationId"
    post:
      operationId: acknowledgeEscalation
      summary: Acknowledge an escalation and stop automatic tier promotion
      tags: [Escalations]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acknowledgedBy]
              properties:
                acknowledgedBy:
                  type: string
                clinicalDisposition:
                  type: string
                  enum: [monitor, contact_patient, in_person_visit, emergency_transfer, no_action]
                note:
                  type: string
      responses:
        "200":
          description: Escalation acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEscalationEvent"
  /v1/handoffs:
    post:
      operationId: offerHandoff
      summary: Offer accountability transfer with open problems and pending results
      tags: [Handoffs]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffCreate"
      responses:
        "201":
          description: Handoff offered, accountability not yet transferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeHandoff"
  /v1/handoffs/{handoffId}/acceptance:
    parameters:
      - $ref: "#/components/parameters/HandoffId"
    post:
      operationId: acceptHandoff
      summary: Accept a handoff and take accountability for its tasks
      tags: [Handoffs]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptedBy]
              properties:
                acceptedBy:
                  type: string
                unresolvedItemsAcknowledged:
                  type: boolean
      responses:
        "200":
          description: Handoff accepted and accountability transferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeHandoff"
        "409":
          description: Handoff lapsed and tasks returned to the offering teammate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/overrides:
    post:
      operationId: recordOverride
      summary: Record a one-step clinician override of a machine recommendation
      tags: [Surveillance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverrideEventCreate"
      responses:
        "201":
          description: Override recorded, never blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOverrideEvent"
  /v1/surveillance/subgroup-performance:
    get:
      operationId: listSubgroupPerformance
      summary: List agent performance against credentialed claim by subgroup
      tags: [Surveillance]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: teammateId
          in: query
          schema:
            type: string
        - name: breachedOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Subgroup performance metrics page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSubgroupPerformanceMetric"
  /v1/surveillance/panel-capacity:
    get:
      operationId: getPanelCapacitySnapshot
      summary: Get supervised panel per FTE alongside escalation-to-recognition time
      tags: [Surveillance]
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            example: 2026-08
        - name: unitId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Panel capacity snapshot with paired safety indicator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePanelCapacitySnapshot"
  /v1/safety-events:
    get:
      operationId: listSafetyEvents
      summary: List near-miss and harm events involving machine teammates
      tags: [Safety]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: severity
          in: query
          schema:
            type: string
            enum: [near_miss, no_harm, temporary_harm, permanent_harm, death]
      responses:
        "200":
          description: Safety events page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSafetyEvent"
    post:
      operationId: openSafetyEvent
      summary: Open a safety event bound to task, agent version and consent state
      tags: [Safety]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyEventCreate"
      responses:
        "201":
          description: Safety event opened with reporting deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSafetyEvent"
  /v1/audit/care-tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: getTaskAccountabilityRecord
      summary: Reconstruct performer, supervisor, agent version, scope and consent for a task
      tags: [Audit]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Accountability record suitable for legal or regulatory production
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAccountabilityRecord"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/audit/access:
    get:
      operationId: listAccessAuditEntries
      summary: List which teammates read a patient record and for which task
      tags: [Audit]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: patientId
          in: query
          schema:
            type: string
        - name: teammateId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Access audit entries page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAccessAuditEntry"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    TeammateId:
      name: teammateId
      in: path
      required: true
      schema:
        type: string
    ScopeId:
      name: scopeId
      in: path
      required: true
      schema:
        type: string
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    EscalationId:
      name: escalationId
      in: path
      required: true
      schema:
        type: string
    HandoffId:
      name: handoffId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        scopeViolationCode:
          type: string
          description: Populated when refusal was caused by a scope or consent boundary
    Patient:
      type: object
      required: [id, mrn]
      properties:
        id:
          type: string
        mrn:
          type: string
          description: Medical record number in the EHR of record
        fhirPatientRef:
          type: string
          example: Patient/9f2c
        primaryLanguage:
          type: string
        payerClass:
          type: string
          enum: [commercial, medicare, medicaid, dual_eligible, self_pay, other]
        monitoringProgramme:
          type: string
          enum: [heart_failure, copd, diabetes_insulin, post_surgical, oncology_supportive, none]
    CareTeam:
      type: object
      required: [id, patientId, members]
      properties:
        id:
          type: string
        patientId:
          type: string
        members:
          type: array
          items:
            type: object
            required: [teammateId, role]
            properties:
              teammateId:
                type: string
              role:
                type: string
                enum:
                  [
                    attending_physician,
                    nurse_practitioner,
                    care_manager_rn,
                    medical_assistant,
                    community_health_worker,
                    monitoring_agent,
                    triage_agent,
                    documentation_agent,
                    family_caregiver,
                  ]
              supervisingTeammateId:
                type: string
        machineFreePathAvailable:
          type: boolean
          description: True when a fully human staffing option exists for this patient's programme
    Teammate:
      type: object
      required: [id, kind, displayName, rosterStatus]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [human_clinician, machine_agent]
        displayName:
          type: string
        rosterStatus:
          type: string
          enum: [candidate, shadow, live, suspended, retired]
        licence:
          type: object
          description: Present for human clinicians
          properties:
            licenceType:
              type: string
              enum: [MD, DO, NP, PA, RN, LPN, MA, CHW, PharmD]
            licenceNumber:
              type: string
            jurisdictions:
              type: array
              items:
                type: string
        machineProfile:
          $ref: "#/components/schemas/MachineAgentProfile"
        activeScopeIds:
          type: array
          items:
            type: string
    TeammateCreate:
      type: object
      required: [kind, displayName]
      properties:
        kind:
          type: string
          enum: [human_clinician, machine_agent]
        displayName:
          type: string
        licenceType:
          type: string
          enum: [MD, DO, NP, PA, RN, LPN, MA, CHW, PharmD]
        licenceNumber:
          type: string
        jurisdictions:
          type: array
          items:
            type: string
        machineProfile:
          $ref: "#/components/schemas/MachineAgentProfile"
    MachineAgentProfile:
      type: object
      required: [vendor, agentVersion, intendedUse]
      properties:
        vendor:
          type: string
        agentVersion:
          type: string
          example: 4.2.1
        intendedUse:
          type: string
          description: Labelled intended use as claimed by the vendor
        autonomyLevel:
          type: string
